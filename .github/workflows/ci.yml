name: CI

# Runner-free Connect IQ CI.
# ---------------------------
# Everything runs on stock GitHub-hosted ubuntu-latest. The Garmin Connect IQ
# SDK is NOT downloaded - it comes from running a pre-built Connect IQ Docker
# image as the job `container`. No self-hosted runner, no SDK install step.
#
# The single stable status to require in branch protection is `ci-required`
# (see docs/ci.md). Do not require the individual job names.

on:
  push:
    branches: [main]
    # Docs / images / store assets do not affect the build. A required check
    # still posts on every PR because pull_request below has NO paths-ignore.
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.pdf'
      - 'LICENSE'
      - 'store/**'
      - 'tools/simulate_fields.py'
      - 'tools/plot_speed_curves.py'
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: CarbBurn
  # The CI device matrix MUST equal the manifest <iq:products> list.
  DEVICES: >-
    edge530 edge830 edge540 edge840 edge1030 edge1030plus edge1040 edge1050
    edgeexplore2 fenix6pro fenix7 fenix8pro47mm fr955
  # NOTE: the SDK container digest is pinned at each `container.image` below and
  # deliberately NOT kept here as well - `container.image` cannot read the `env`
  # context, so an env copy would be a dead pin that silently drifts.

jobs:
  # 1) manifest-lint - runner-free. Catches the store-rejection class the SDK
  #    jobs cannot: a bad/placeholder app id still compiles and still tests.
  #    Also asserts manifest.xml and manifest.beta.xml carry DISTINCT ids - two
  #    apps sharing an id are one app to Connect IQ, so an accidental collision
  #    would make the beta replace production instead of installing beside it.
  manifest-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate manifest application ids
        # Invoked with NO arguments on purpose: the script then DISCOVERS
        # manifest.xml + every manifest.<variant>.xml. An enumerated list here
        # is a list somebody can quietly shorten, and dropping the beta from it
        # would silently drop the id-distinctness assertion with it.
        run: python3 scripts/check_manifest_appid.py

  # 2) compile-unit-test - container. Compile a --unit-test build for EVERY
  #    manifest device in ONE job so the image pulls once (not per-device).
  #    The codebase is intentionally untyped, so -w raises warnings but they do
  #    NOT fail the build - only a non-zero monkeyc exit does. No -l 3.
  compile-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # hard cap so a hung compiler fails the job instead of the run
    container:
      image: ghcr.io/matco/connectiq-tester@sha256:7a6f586cb0e0393ff288da09cf27b6dad40a0058a346c529b99fd0fc19858f0f # v2.8.0 = SDK 9.2.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate throwaway developer key
        run: |
          set -eu
          command -v openssl >/dev/null 2>&1 || { apt-get update && apt-get install -y openssl; }
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in developer_key.pem -out developer_key.der -nocrypt

      - name: Compile --unit-test for every device
        run: |
          set -u
          if command -v monkeyc >/dev/null 2>&1; then MONKEYC="$(command -v monkeyc)"
          elif [ -x /connectiq/bin/monkeyc ]; then MONKEYC=/connectiq/bin/monkeyc
          else MONKEYC="$(find / -type f -name monkeyc 2>/dev/null | head -1)"; fi
          [ -n "$MONKEYC" ] || { echo "::error::monkeyc not found in image"; exit 3; }
          echo "monkeyc: $MONKEYC"
          mkdir -p bin
          fail=0
          for dev in $DEVICES; do
            echo "::group::compile --unit-test $dev"
            if "$MONKEYC" -f monkey.jungle -o "bin/${APP_NAME}-test-$dev.prg" \
                 -y developer_key.der -d "$dev" --unit-test -w; then
              echo "OK   $dev"
            else
              rc=$?
              echo "::error::compile --unit-test failed for $dev (monkeyc rc=$rc)"
              echo "FAIL $dev (rc=$rc)"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more devices failed the --unit-test compile"
            exit 1
          fi
          echo "all $(echo $DEVICES | wc -w) devices compiled (--unit-test) OK"

      - name: Upload unit-test .prg artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-prgs
          path: bin/*-test-*.prg
          if-no-files-found: ignore
          retention-days: 7

  # 3) run-tests - NOT WIRED, and now for a MEASURED reason rather than a guess.
  #    The (:test) suite (source/CarbBurnTest.mc) is COMPILE-gated across all 13
  #    devices by compile-unit-test above.
  #
  #    #28's control experiment has been run and answered: this job was wired
  #    here as continue-on-error WITH the CbvTest seam in place (so the
  #    duplicate-FIT-id constructor abort was already eliminated) and monkeydo
  #    STILL timed out with no test output - run 30129233091, job 89599813195,
  #    rc=124 at head acd3328. Conclusion: the container headless path is a
  #    SECOND, INDEPENDENT problem, not merely the constructor abort. Fixing it
  #    belongs to #28; executing the suite belongs to #31.
  #
  #    The job is therefore removed again rather than left permanently red on
  #    every PR: it has produced the finding it existed to produce. The
  #    paste-ready stanza is kept in docs/ci.md, so re-wiring is a copy away the
  #    moment #28 lands. Nothing here is being hidden - the failing evidence is
  #    linked above and recorded in docs/ci.md.

  # 4) release-build - container. Compile the NON-unit-test RELEASE artifact for
  #    every device (the build that actually ships) and export the store .iq.
  #    For type=datafield, monkeyc exits non-zero when the static image exceeds
  #    the target's data-field memory limit - so a non-zero exit IS the budget
  #    assertion (we do not merely log sizes).
  #
  #    It also asserts the shipped artifacts carry the REGISTERED application id.
  #    That guard exists because the repo now has more than one manifest: a
  #    one-line repoint of monkey.jungle at manifest.beta.xml compiles clean,
  #    lints clean and exports a store .iq under the UNREGISTERED beta id, which
  #    manifest.xml:2-4 says must never happen. Nothing else in this workflow
  #    would notice.
  #
  #    "REGISTERED" is a claim about TWO checks composed, and neither half is
  #    sufficient alone - be careful before weakening either:
  #      * manifest-lint pins manifest.xml's id to the registered literal
  #        (EXPECTED_PRODUCTION_ID in scripts/check_manifest_appid.py), so the
  #        id in the manifest cannot drift;
  #      * this step ties the built .prg to whatever manifest.xml says.
  #    Measured: with a fabricated id substituted into manifest.xml, monkeyc
  #    still exits 0 and THIS STEP still passes (it would print the fabricated
  #    value under "registered id:") - only the lint's pin reds. manifest-lint
  #    is in ci-required.needs, so the composition is what blocks the merge.
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # hard cap so a hung compiler fails the job instead of the run
    container:
      image: ghcr.io/matco/connectiq-tester@sha256:7a6f586cb0e0393ff288da09cf27b6dad40a0058a346c529b99fd0fc19858f0f # v2.8.0 = SDK 9.2.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate throwaway developer key
        run: |
          set -eu
          command -v openssl >/dev/null 2>&1 || { apt-get update && apt-get install -y openssl; }
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in developer_key.pem -out developer_key.der -nocrypt

      - name: Release-compile every device (gates the data-field memory budget)
        run: |
          set -u
          if command -v monkeyc >/dev/null 2>&1; then MONKEYC="$(command -v monkeyc)"
          elif [ -x /connectiq/bin/monkeyc ]; then MONKEYC=/connectiq/bin/monkeyc
          else MONKEYC="$(find / -type f -name monkeyc 2>/dev/null | head -1)"; fi
          [ -n "$MONKEYC" ] || { echo "::error::monkeyc not found in image"; exit 3; }
          echo "monkeyc: $MONKEYC"
          mkdir -p bin
          fail=0
          for dev in $DEVICES; do
            echo "::group::release-compile $dev"
            if "$MONKEYC" -f monkey.jungle -o "bin/${APP_NAME}-$dev.prg" \
                 -y developer_key.der -d "$dev" -r -w; then
              echo "OK   $dev"
            else
              rc=$?
              echo "::error::release compile failed for $dev (monkeyc rc=$rc) - may be over the data-field memory budget"
              echo "FAIL $dev (rc=$rc)"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more devices failed the release compile / memory budget"
            exit 1
          fi
          echo "all $(echo $DEVICES | wc -w) devices release-compiled OK"

      - name: Assert the shipped .prg carry the REGISTERED application id
        # Same argument as the beta job's mirror of this step, applied to the
        # artifact that actually ships: an XML diff proves the file on disk
        # changed, it does not prove monkeyc consumed it. monkeyc embeds the
        # application id in the .prg as 16 RAW bytes, so hexdump each artifact
        # and require the PRODUCTION id present and the BETA id absent.
        #
        # This runs BEFORE the .iq export on purpose: a wrong id must stop the
        # store package from being produced at all, not be caught after it
        # exists. The .iq is exported from the same jungle and therefore the
        # same project.manifest, so a repoint that would poison the .iq poisons
        # these .prg first - measured: in the swapped-jungle mutant, the 13 .prg
        # and the .iq internal manifest carry the beta id together.
        #
        # NOTE on the label "registered": $PROD below is read out of
        # manifest.xml, so THIS step alone asserts only that the artifact agrees
        # with the manifest it was built from. What makes "registered" true is
        # manifest-lint's pin of manifest.xml to the literal registered id. Both
        # are required jobs; do not weaken one assuming the other covers it.
        #
        # sh + coreutils, not python3: nothing has established that this
        # container ships python3. Caveat: the search is over a flattened nibble
        # stream, so it is not byte-aligned; a false hit needs a specific 16-byte
        # sequence off-alignment, which is not a practical concern at these sizes.
        run: |
          set -eu
          idof() { sed -n 's/.*id="\([0-9a-fA-F]\{32\}\)".*/\1/p' "$1" | head -1 | tr 'A-Z' 'a-z'; }
          PROD=$(idof manifest.xml)
          BETA=$(idof manifest.beta.xml)
          [ -n "$PROD" ] || { echo "::error::no 32-hex app id in manifest.xml"; exit 1; }
          [ -n "$BETA" ] || { echo "::error::no 32-hex app id in manifest.beta.xml"; exit 1; }
          [ "$PROD" != "$BETA" ] || { echo "::error::manifest ids identical - nothing to assert"; exit 1; }
          echo "registered id: $PROD"
          echo "beta id:       $BETA"
          n=0; bad=0
          # Iterate $DEVICES rather than globbing: this also asserts that every
          # expected artifact EXISTS, and a glob like bin/CarbBurn-*.prg would
          # additionally sweep in bin/CarbBurn-Beta-*.prg if the two jobs were
          # ever merged into one workspace.
          for dev in $DEVICES; do
            f="bin/${APP_NAME}-$dev.prg"
            n=$((n+1))
            if [ ! -f "$f" ]; then
              echo "::error::$f missing - the release loop did not produce it"
              bad=$((bad+1)); continue
            fi
            hex=$(od -An -v -tx1 "$f" | tr -d ' \n')
            ok=1
            case "$hex" in *"$PROD"*) : ;; *) echo "::error::$f does NOT embed the registered app id"; ok=0 ;; esac
            case "$hex" in *"$BETA"*) echo "::error::$f embeds the BETA app id - monkey.jungle must point at manifest.xml"; ok=0 ;; *) : ;; esac
            if [ "$ok" -eq 1 ]; then echo "OK   $f"; else bad=$((bad+1)); fi
          done
          [ "$n" -gt 0 ] || { echo "::error::DEVICES is empty - nothing was asserted"; exit 1; }
          if [ "$bad" -ne 0 ]; then
            echo "::error::$bad/$n release .prg carried the wrong application id - refusing to export the store package"
            exit 1
          fi
          echo "all $n release .prg embed $PROD and not $BETA"

      - name: Export the store package (.iq)
        run: |
          set -eu
          if command -v monkeyc >/dev/null 2>&1; then MONKEYC="$(command -v monkeyc)"
          elif [ -x /connectiq/bin/monkeyc ]; then MONKEYC=/connectiq/bin/monkeyc
          else MONKEYC="$(find / -type f -name monkeyc 2>/dev/null | head -1)"; fi
          [ -n "$MONKEYC" ] || { echo "::error::monkeyc not found in image"; exit 3; }
          mkdir -p bin
          # Mirrors tools/build_iq.sh: -e export, -r release, -w warnings.
          # NOTE: this .iq is signed with a THROWAWAY key and is NOT
          # store-submittable. A real release re-exports with the account-bound
          # key - deliberately not done in CI.
          "$MONKEYC" -e -r -w -f monkey.jungle -y developer_key.der -o "bin/${APP_NAME}.iq"
          ls -l "bin/${APP_NAME}.iq"

      - name: Upload release .prg + .iq artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            bin/*.prg
            bin/*.iq
          if-no-files-found: warn
          retention-days: 7

  # 5) beta-build - container. The parallel-install BETA variant (beta.jungle ->
  #    manifest.beta.xml, a separate application id) release-compiled for every
  #    device in the same matrix, plus its packaged .iq.
  #
  #    Why a separate job rather than extra steps in release-build: a beta
  #    failure and a production failure are different faults and should be
  #    different red squares. The cost is a third pull of the same pinned image.
  #
  #    What this job gates that nothing else does: manifest.beta.xml and
  #    beta.jungle are consumed by NO other job, so without this they could rot
  #    unnoticed. Specifically, monkeyc exits 102 ("Target device id 'X' is not
  #    enabled in the application manifest file") when $DEVICES names a product
  #    the beta manifest omits - measured locally with SDK 9.2.0 - so this loop
  #    is a real assertion that the beta declares the whole matrix, not just
  #    that it compiles.
  #
  #    NOTE: like release-build, the .iq here is signed with a THROWAWAY key.
  #    The beta app id was not registered on the store by this project (see
  #    manifest.beta.xml for the canonical wording) and must never be
  #    submitted there; these artifacts exist for sideloading.
  beta-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # hard cap so a hung compiler fails the job instead of the run
    container:
      image: ghcr.io/matco/connectiq-tester@sha256:7a6f586cb0e0393ff288da09cf27b6dad40a0058a346c529b99fd0fc19858f0f # v2.8.0 = SDK 9.2.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate throwaway developer key
        run: |
          set -eu
          command -v openssl >/dev/null 2>&1 || { apt-get update && apt-get install -y openssl; }
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in developer_key.pem -out developer_key.der -nocrypt

      - name: Release-compile the beta variant for every device
        run: |
          set -u
          if command -v monkeyc >/dev/null 2>&1; then MONKEYC="$(command -v monkeyc)"
          elif [ -x /connectiq/bin/monkeyc ]; then MONKEYC=/connectiq/bin/monkeyc
          else MONKEYC="$(find / -type f -name monkeyc 2>/dev/null | head -1)"; fi
          [ -n "$MONKEYC" ] || { echo "::error::monkeyc not found in image"; exit 3; }
          echo "monkeyc: $MONKEYC"
          mkdir -p bin
          fail=0
          for dev in $DEVICES; do
            echo "::group::beta release-compile $dev"
            if "$MONKEYC" -f beta.jungle -o "bin/${APP_NAME}-Beta-$dev.prg" \
                 -y developer_key.der -d "$dev" -r -w; then
              echo "OK   $dev"
            else
              rc=$?
              echo "::error::beta release compile failed for $dev (monkeyc rc=$rc)"
              echo "FAIL $dev (rc=$rc)"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more devices failed the beta release compile"
            exit 1
          fi
          echo "all $(echo $DEVICES | wc -w) devices beta release-compiled OK"

      - name: Export the beta package (.iq)
        run: |
          set -eu
          if command -v monkeyc >/dev/null 2>&1; then MONKEYC="$(command -v monkeyc)"
          elif [ -x /connectiq/bin/monkeyc ]; then MONKEYC=/connectiq/bin/monkeyc
          else MONKEYC="$(find / -type f -name monkeyc 2>/dev/null | head -1)"; fi
          [ -n "$MONKEYC" ] || { echo "::error::monkeyc not found in image"; exit 3; }
          mkdir -p bin
          # Mirrors tools/build_beta.sh: -e export, -r release, -w warnings.
          "$MONKEYC" -e -r -w -f beta.jungle -y developer_key.der -o "bin/${APP_NAME}-Beta.iq"
          ls -l "bin/${APP_NAME}-Beta.iq"

      - name: Assert the built beta .prg carry the BETA application id
        # An XML diff proves the file on disk changed; it does not prove monkeyc
        # consumed it. The compiler embeds the application id in the .prg as 16
        # RAW bytes, so hexdump each artifact and require the beta id present
        # and the production id absent. Pure sh + coreutils - no assumption that
        # this container ships python3.
        # Caveat: the search is over a flattened nibble stream, so it is not
        # byte-aligned; a false hit needs a specific 16-byte sequence to appear
        # off-alignment, which is not a practical concern at these file sizes.
        run: |
          set -eu
          idof() { sed -n 's/.*id="\([0-9a-fA-F]\{32\}\)".*/\1/p' "$1" | head -1 | tr 'A-Z' 'a-z'; }
          PROD=$(idof manifest.xml)
          BETA=$(idof manifest.beta.xml)
          [ -n "$PROD" ] || { echo "::error::no 32-hex app id in manifest.xml"; exit 1; }
          [ -n "$BETA" ] || { echo "::error::no 32-hex app id in manifest.beta.xml"; exit 1; }
          [ "$PROD" != "$BETA" ] || { echo "::error::manifest ids identical - nothing to assert"; exit 1; }
          echo "production id: $PROD"
          echo "beta id:       $BETA"
          n=0; bad=0
          # Iterate $DEVICES, not a glob - see the mirror of this step in
          # release-build for why (it also asserts each artifact exists).
          for dev in $DEVICES; do
            f="bin/${APP_NAME}-Beta-$dev.prg"
            n=$((n+1))
            if [ ! -f "$f" ]; then
              echo "::error::$f missing - the beta release loop did not produce it"
              bad=$((bad+1)); continue
            fi
            hex=$(od -An -v -tx1 "$f" | tr -d ' \n')
            ok=1
            case "$hex" in *"$BETA"*) : ;; *) echo "::error::$f does NOT embed the beta app id"; ok=0 ;; esac
            case "$hex" in *"$PROD"*) echo "::error::$f embeds the PRODUCTION app id"; ok=0 ;; *) : ;; esac
            if [ "$ok" -eq 1 ]; then echo "OK   $f"; else bad=$((bad+1)); fi
          done
          [ "$n" -gt 0 ] || { echo "::error::DEVICES is empty - nothing was asserted"; exit 1; }
          if [ "$bad" -ne 0 ]; then
            echo "::error::$bad/$n beta .prg carried the wrong application id"
            exit 1
          fi
          echo "all $n beta .prg embed $BETA and not $PROD"

      - name: Upload beta .prg + .iq artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beta-artifacts
          path: |
            bin/*-Beta-*.prg
            bin/*-Beta.iq
          if-no-files-found: warn
          retention-days: 7

  # 6) ci-required - the SINGLE stable status to require in branch protection.
  #    GitHub treats a SKIPPED required check as PASSED, so the aggregator must
  #    RUN on every PR (if: always()) and post a real `failure` when anything
  #    upstream is not `success` - a skipped/cancelled/failed dependency has to
  #    make THIS job conclude `failure`, or a broken build merges. `needs` is
  #    the gate: the check iterates toJSON(needs), so any job added to `needs`
  #    is enforced automatically. Contract: every job in `needs` MUST run
  #    unconditionally (no job-level `if:`), so a skip is always a real fault.
  #
  #    beta-build IS in `needs`, deliberately. It satisfies the contract - no
  #    job-level `if:`, so it runs on every PR and a skip really is a fault -
  #    and it is the only job that consumes manifest.beta.xml / beta.jungle.
  #    Left advisory, those two files could break and merge green, and the
  #    beta's whole purpose (installing beside production for an A/B ride) is
  #    only usable if it actually builds.
  ci-required:
    runs-on: ubuntu-latest
    needs: [manifest-lint, compile-unit-test, release-build, beta-build]
    if: always()
    steps:
      - name: Assert every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          printf '%s\n' "$NEEDS"
          printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v.get("result") for k, v in needs.items() if v.get("result") != "success"}
          if bad:
              print("::error::required job(s) did not succeed: %s" % bad)
              sys.exit(1)
          print("all required jobs succeeded: %s" % ", ".join(sorted(needs)))
          '

  # ---- Optional advisory jobs (continue-on-error, OUT of ci-required.needs) ----
  # Never blocks a merge. Kept low-noise on purpose; anything flaky stays here
  # until proven with a RED/GREEN differential.
  advisory-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Flag debug leftovers / TODOs (advisory only)
        run: |
          set -u
          hits=0
          while IFS= read -r line; do
            echo "::warning::$line"
            hits=$((hits+1))
          done < <(grep -rnE 'System\.println\(|\bTODO\b|\bFIXME\b' source/ 2>/dev/null || true)
          echo "advisory-lint: $hits note(s) - informational, does not block."
