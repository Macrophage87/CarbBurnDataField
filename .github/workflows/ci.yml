name: CI

# Runner-free Connect IQ CI.
# ---------------------------
# Everything runs on stock GitHub-hosted ubuntu-latest. The Garmin Connect IQ
# SDK is NOT downloaded - it comes from running a pre-built Connect IQ Docker
# image as the job `container`. No self-hosted runner, no SDK install step.
#
# The single stable status to require in branch protection is `ci-required`
# (see docs/ci.md). Do not require the individual job names.

on:
  push:
    branches: [main]
    # Docs / images / store assets do not affect the build. A required check
    # still posts on every PR because pull_request below has NO paths-ignore.
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.pdf'
      - 'LICENSE'
      - 'store/**'
      - 'tools/simulate_fields.py'
      - 'tools/plot_speed_curves.py'
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: CarbBurn
  # The CI device matrix MUST equal the manifest <iq:products> list.
  DEVICES: >-
    edge530 edge830 edge540 edge840 edge1030 edge1030plus edge1040 edge1050
    edgeexplore2 fenix6pro fenix7 fenix8pro47mm fr955
  # NOTE: the SDK container digest is pinned at each `container.image` below and
  # deliberately NOT kept here as well - `container.image` cannot read the `env`
  # context, so an env copy would be a dead pin that silently drifts.

jobs:
  # 1) manifest-lint - runner-free. Catches the store-rejection class the SDK
  #    jobs cannot: a bad/placeholder app id still compiles and still tests.
  manifest-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate manifest application id
        run: python3 scripts/check_manifest_appid.py manifest.xml

  # 2) compile-unit-test - container. Compile a --unit-test build for EVERY
  #    manifest device in ONE job so the image pulls once (not per-device).
  #    The codebase is intentionally untyped, so -w raises warnings but they do
  #    NOT fail the build - only a non-zero monkeyc exit does. No -l 3.
  compile-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # hard cap so a hung compiler fails the job instead of the run
    container:
      image: ghcr.io/matco/connectiq-tester@sha256:64958e8fd2925d0c4986d72a9aa9d8e2101297a881354aab0118be2f1dc22105 # v2.10.0 (image built 2026-09-01); SDK version is echoed by the build step, not asserted here
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate throwaway developer key
        run: |
          set -eu
          command -v openssl >/dev/null 2>&1 || { apt-get update && apt-get install -y openssl; }
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in developer_key.pem -out developer_key.der -nocrypt

      - name: Compile --unit-test for every device
        run: |
          set -u
          if command -v monkeyc >/dev/null 2>&1; then MONKEYC="$(command -v monkeyc)"
          elif [ -x /connectiq/bin/monkeyc ]; then MONKEYC=/connectiq/bin/monkeyc
          else MONKEYC="$(find / -type f -name monkeyc 2>/dev/null | head -1)"; fi
          [ -n "$MONKEYC" ] || { echo "::error::monkeyc not found in image"; exit 3; }
          echo "monkeyc: $MONKEYC"
          # Record the SDK the pinned image actually ships, so the digest
          # comment above is a measured fact and not a claim (see #14).
          "$MONKEYC" --version || true
          mkdir -p bin
          fail=0
          for dev in $DEVICES; do
            echo "::group::compile --unit-test $dev"
            if "$MONKEYC" -f monkey.jungle -o "bin/${APP_NAME}-test-$dev.prg" \
                 -y developer_key.der -d "$dev" --unit-test -w; then
              echo "OK   $dev"
            else
              rc=$?
              echo "::error::compile --unit-test failed for $dev (monkeyc rc=$rc)"
              echo "FAIL $dev (rc=$rc)"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more devices failed the --unit-test compile"
            exit 1
          fi
          echo "all $(echo $DEVICES | wc -w) devices compiled (--unit-test) OK"

      - name: Upload unit-test .prg artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-prgs
          path: bin/*-test-*.prg
          if-no-files-found: ignore
          retention-days: 7

  # 3) run-tests - NOT WIRED, and now for a MEASURED reason rather than a guess.
  #    The (:test) suite (source/CarbBurnTest.mc) is COMPILE-gated across all 13
  #    devices by compile-unit-test above.
  #
  #    #28's control experiment has been run and answered: this job was wired
  #    here as continue-on-error WITH the CbvTest seam in place (so the
  #    duplicate-FIT-id constructor abort was already eliminated) and monkeydo
  #    STILL timed out with no test output - run 30129233091, job 89599813195,
  #    rc=124 at head acd3328. Conclusion: the container headless path is a
  #    SECOND, INDEPENDENT problem, not merely the constructor abort. Fixing it
  #    belongs to #28; executing the suite belongs to #31.
  #
  #    The job is therefore removed again rather than left permanently red on
  #    every PR: it has produced the finding it existed to produce. The
  #    paste-ready stanza is kept in docs/ci.md, so re-wiring is a copy away the
  #    moment #28 lands. Nothing here is being hidden - the failing evidence is
  #    linked above and recorded in docs/ci.md.

  # 4) release-build - container. Compile the NON-unit-test RELEASE artifact for
  #    every device (the build that actually ships) and export the store .iq.
  #    For type=datafield, monkeyc exits non-zero when the static image exceeds
  #    the target's data-field memory limit - so a non-zero exit IS the budget
  #    assertion (we do not merely log sizes).
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # hard cap so a hung compiler fails the job instead of the run
    container:
      image: ghcr.io/matco/connectiq-tester@sha256:64958e8fd2925d0c4986d72a9aa9d8e2101297a881354aab0118be2f1dc22105 # v2.10.0 (image built 2026-09-01); SDK version is echoed by the build step, not asserted here
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate throwaway developer key
        run: |
          set -eu
          command -v openssl >/dev/null 2>&1 || { apt-get update && apt-get install -y openssl; }
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in developer_key.pem -out developer_key.der -nocrypt

      - name: Release-compile every device (gates the data-field memory budget)
        run: |
          set -u
          if command -v monkeyc >/dev/null 2>&1; then MONKEYC="$(command -v monkeyc)"
          elif [ -x /connectiq/bin/monkeyc ]; then MONKEYC=/connectiq/bin/monkeyc
          else MONKEYC="$(find / -type f -name monkeyc 2>/dev/null | head -1)"; fi
          [ -n "$MONKEYC" ] || { echo "::error::monkeyc not found in image"; exit 3; }
          echo "monkeyc: $MONKEYC"
          # Record the SDK the pinned image actually ships, so the digest
          # comment above is a measured fact and not a claim (see #14).
          "$MONKEYC" --version || true
          mkdir -p bin
          fail=0
          for dev in $DEVICES; do
            echo "::group::release-compile $dev"
            if "$MONKEYC" -f monkey.jungle -o "bin/${APP_NAME}-$dev.prg" \
                 -y developer_key.der -d "$dev" -r -w; then
              echo "OK   $dev"
            else
              rc=$?
              echo "::error::release compile failed for $dev (monkeyc rc=$rc) - may be over the data-field memory budget"
              echo "FAIL $dev (rc=$rc)"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more devices failed the release compile / memory budget"
            exit 1
          fi
          echo "all $(echo $DEVICES | wc -w) devices release-compiled OK"

      - name: Export the store package (.iq)
        run: |
          set -eu
          if command -v monkeyc >/dev/null 2>&1; then MONKEYC="$(command -v monkeyc)"
          elif [ -x /connectiq/bin/monkeyc ]; then MONKEYC=/connectiq/bin/monkeyc
          else MONKEYC="$(find / -type f -name monkeyc 2>/dev/null | head -1)"; fi
          [ -n "$MONKEYC" ] || { echo "::error::monkeyc not found in image"; exit 3; }
          mkdir -p bin
          # Mirrors tools/build_iq.sh: -e export, -r release, -w warnings.
          # NOTE: this .iq is signed with a THROWAWAY key and is NOT
          # store-submittable. A real release re-exports with the account-bound
          # key - deliberately not done in CI.
          "$MONKEYC" -e -r -w -f monkey.jungle -y developer_key.der -o "bin/${APP_NAME}.iq"
          ls -l "bin/${APP_NAME}.iq"

      - name: Upload release .prg + .iq artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            bin/*.prg
            bin/*.iq
          if-no-files-found: warn
          retention-days: 7

  # 5) ci-required - the SINGLE stable status to require in branch protection.
  #    GitHub treats a SKIPPED required check as PASSED, so the aggregator must
  #    RUN on every PR (if: always()) and post a real `failure` when anything
  #    upstream is not `success` - a skipped/cancelled/failed dependency has to
  #    make THIS job conclude `failure`, or a broken build merges. `needs` is
  #    the gate: the check iterates toJSON(needs), so any job added to `needs`
  #    is enforced automatically. Contract: every job in `needs` MUST run
  #    unconditionally (no job-level `if:`), so a skip is always a real fault.
  ci-required:
    runs-on: ubuntu-latest
    needs: [manifest-lint, compile-unit-test, release-build]
    if: always()
    steps:
      - name: Assert every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          printf '%s\n' "$NEEDS"
          printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v.get("result") for k, v in needs.items() if v.get("result") != "success"}
          if bad:
              print("::error::required job(s) did not succeed: %s" % bad)
              sys.exit(1)
          print("all required jobs succeeded: %s" % ", ".join(sorted(needs)))
          '

  # ---- Optional advisory jobs (continue-on-error, OUT of ci-required.needs) ----
  # Never blocks a merge. Kept low-noise on purpose; anything flaky stays here
  # until proven with a RED/GREEN differential.
  advisory-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Flag debug leftovers / TODOs (advisory only)
        run: |
          set -u
          hits=0
          while IFS= read -r line; do
            echo "::warning::$line"
            hits=$((hits+1))
          done < <(grep -rnE 'System\.println\(|\bTODO\b|\bFIXME\b' source/ 2>/dev/null || true)
          echo "advisory-lint: $hits note(s) - informational, does not block."
